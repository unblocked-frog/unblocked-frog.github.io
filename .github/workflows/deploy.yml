name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: |
          npx vite build
          touch ./dist/.nojekyll

      # 1. Primary: Official GitHub Pages deployment (Requires Settings -> Pages -> Source: GitHub Actions)
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 2. Secondary fallback: Deploy to gh-pages branch (works with Settings -> Pages -> Source: Deploy from a branch -> gh-pages)
      - name: Deploy to gh-pages branch (fallback)
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          folder: dist
          branch: gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
